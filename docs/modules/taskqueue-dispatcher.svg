<svg viewBox="0 0 819 1546" role="img" aria-label="One firing of the Dispatcher, step by step"><defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs><rect class="box m" x="178" y="40" width="304" height="54" rx="8"/><text x="330" y="63" text-anchor="middle"><tspan x="330" dy="0">A firing starts</tspan><tspan x="330" dy="16">(launchd, every 2 minutes by default)</tspan></text><rect class="box " x="197" y="128" width="267" height="54" rx="8"/><text x="330" y="151" text-anchor="middle"><tspan x="330" dy="0">Read the settings and the state;</tspan><tspan x="330" dy="16">note a host sleep</tspan></text><path class="ar" d="M330 94V128" marker-end="url(#wa)"/><rect class="box " x="163" y="216" width="333" height="70" rx="8"/><text x="330" y="239" text-anchor="middle"><tspan x="330" dy="0">Look after the running Workers:</tspan><tspan x="330" dy="16">started: the task is WIP;</tspan><tspan x="330" dy="16">over a limit: kill it, the task is failed</tspan></text><path class="ar" d="M330 182V216" marker-end="url(#wa)"/><polygon class="dia" points="330,320 479,376 330,432 181,376"/><text x="330" y="364" text-anchor="middle"><tspan x="330" dy="0">A Worker has ended:</tspan><tspan x="330" dy="16">commit in its bundle and</tspan><tspan x="330" dy="16">it did not give up?</tspan></text><path class="ar" d="M330 286V320" marker-end="url(#wa)"/><text class="sm" x="173" y="370" text-anchor="end">yes</text><path class="ar" d="M181 376H141" marker-end="url(#wa)"/><rect class="st" x="51" y="360" width="90" height="32" rx="16" style="stroke:var(--s-unmerged);stroke-width:2.5"/><text x="96" y="380" text-anchor="middle"><tspan x="96" dy="0">Unmerged</tspan></text><path class="ar" d="M479 376H519" marker-end="url(#wa)"/><text class="sm" x="487" y="370" text-anchor="start">no</text><rect class="st" x="519" y="360" width="80" height="32" rx="16" style="stroke:var(--s-failed);stroke-width:2.5"/><text x="559" y="380" text-anchor="middle"><tspan x="559" dy="0">Failed</tspan></text><rect class="box " x="163" y="466" width="333" height="54" rx="8"/><text x="330" y="489" text-anchor="middle"><tspan x="330" dy="0">Start the proxy while a released task</tspan><tspan x="330" dy="16">waits or a Worker runs; stop it otherwise</tspan></text><path class="ar" d="M330 432V466" marker-end="url(#wa)"/><polygon class="dia" points="330,554 500,602 330,650 160,602"/><text x="330" y="598" text-anchor="middle"><tspan x="330" dy="0">Switched off in Settings, or</tspan><tspan x="330" dy="16">the interval not yet over?</tspan></text><path class="ar" d="M330 520V554" marker-end="url(#wa)"/><polygon class="dia" points="330,684 473,724 330,764 187,724"/><text x="330" y="728" text-anchor="middle"><tspan x="330" dy="0">Free disk below 10 GiB?</tspan></text><path class="ar" d="M330 650V684" marker-end="url(#wa)"/><polygon class="dia" points="330,798 489,846 330,894 171,846"/><text x="330" y="842" text-anchor="middle"><tspan x="330" dy="0">Proxy, container and relay</tspan><tspan x="330" dy="16">could not be started?</tspan></text><path class="ar" d="M330 764V798" marker-end="url(#wa)"/><polygon class="dia" points="330,928 457,968 330,1008 203,968"/><text x="330" y="972" text-anchor="middle"><tspan x="330" dy="0">No free Worker slot?</tspan></text><path class="ar" d="M330 894V928" marker-end="url(#wa)"/><rect class="box " x="182" y="1042" width="296" height="54" rx="8"/><text x="330" y="1065" text-anchor="middle"><tspan x="330" dy="0">Choose the task: priority, deadline,</tspan><tspan x="330" dy="16">what it unblocks, must before nice</tspan></text><path class="ar" d="M330 1008V1042" marker-end="url(#wa)"/><polygon class="dia" points="330,1130 495,1170 330,1210 165,1170"/><text x="330" y="1174" text-anchor="middle"><tspan x="330" dy="0">No released task to choose?</tspan></text><path class="ar" d="M330 1096V1130" marker-end="url(#wa)"/><polygon class="dia" points="330,1244 495,1292 330,1340 165,1292"/><text x="330" y="1288" text-anchor="middle"><tspan x="330" dy="0">Can the Worker's user reach</tspan><tspan x="330" dy="16">an outside address?</tspan></text><path class="ar" d="M330 1210V1244" marker-end="url(#wa)"/><rect class="box w" x="178" y="1374" width="304" height="54" rx="8"/><text x="330" y="1397" text-anchor="middle"><tspan x="330" dy="0">Prepare the task folder (main.bundle,</tspan><tspan x="330" dy="16">task.md) and launch one Worker</tspan></text><path class="ar" d="M330 1340V1374" marker-end="url(#wa)"/><rect class="box m" x="226" y="1462" width="208" height="54" rx="8"/><text x="330" y="1485" text-anchor="middle"><tspan x="330" dy="0">Write the heartbeat line</tspan><tspan x="330" dy="16">to the processing log</tspan></text><path class="ar" d="M330 1428V1462" marker-end="url(#wa)"/><path class="ar" d="M500 602H629"/><text class="sm" x="506" y="596" text-anchor="start">yes</text><path class="ar" d="M473 724H629"/><text class="sm" x="479" y="718" text-anchor="start">yes</text><path class="ar" d="M489 846H629"/><text class="sm" x="495" y="840" text-anchor="start">yes</text><path class="ar" d="M457 968H629"/><text class="sm" x="463" y="962" text-anchor="start">yes</text><path class="ar" d="M495 1170H629"/><text class="sm" x="501" y="1164" text-anchor="start">yes</text><path class="ar" d="M495 1292H629"/><text class="sm" x="501" y="1286" text-anchor="start">yes</text><path class="ar" d="M629 602V1489H434" marker-end="url(#wa)"/><text class="sm" x="637" y="1046" text-anchor="start">skip or nothing to do:</text><text class="sm" x="637" y="1060" text-anchor="start">the reason is recorded</text></svg>
