<svg viewBox="0 0 692 838" role="img" aria-label="What runs in the container, from launch to the end check"><defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs><rect class="box m" x="78" y="40" width="304" height="54" rx="8"/><text x="230" y="63" text-anchor="middle"><tspan x="230" dy="0">The Dispatcher launches the Worker as</tspan><tspan x="230" dy="16">workerN in a clone of main.bundle</tspan></text><rect class="box w" x="148" y="128" width="163" height="38" rx="8"/><text x="230" y="151" text-anchor="middle"><tspan x="230" dy="0">Read inbox/task.md</tspan></text><path class="ar" d="M230 94V128" marker-end="url(#wa)"/><rect class="box w" x="141" y="200" width="178" height="38" rx="8"/><text x="230" y="223" text-anchor="middle"><tspan x="230" dy="0">Write outbox/started</tspan></text><path class="ar" d="M230 166V200" marker-end="url(#wa)"/><rect class="box w" x="86" y="272" width="289" height="54" rx="8"/><text x="230" y="295" text-anchor="middle"><tspan x="230" dy="0">Work in the clone; model calls go</tspan><tspan x="230" dy="16">through the relay to the host proxy</tspan></text><path class="ar" d="M230 238V272" marker-end="url(#wa)"/><rect class="box w" x="119" y="360" width="222" height="38" rx="8"/><text x="230" y="383" text-anchor="middle"><tspan x="230" dy="0">Commit on worker/&lt;task-id&gt;</tspan></text><path class="ar" d="M230 326V360" marker-end="url(#wa)"/><rect class="box w" x="104" y="432" width="252" height="54" rx="8"/><text x="230" y="455" text-anchor="middle"><tspan x="230" dy="0">Write outbox/result.bundle and</tspan><tspan x="230" dy="16">outbox/goodbye.json</tspan></text><path class="ar" d="M230 398V432" marker-end="url(#wa)"/><polygon class="dia" points="230,520 432,576 230,632 28,576"/><text x="230" y="564" text-anchor="middle"><tspan x="230" dy="0">End check (Stop hook): note valid,</tspan><tspan x="230" dy="16">commit and bundle present?</tspan><tspan x="230" dy="16">(a gave_up note needs no commit)</tspan></text><path class="ar" d="M230 486V520" marker-end="url(#wa)"/><path class="ar" d="M432 576H502V299H374" marker-end="url(#wa)"/><text class="sm" x="438" y="570" text-anchor="start">no, first time:</text><text class="sm" x="508" y="438" text-anchor="start">stop refused, the</text><text class="sm" x="508" y="452" text-anchor="start">Worker fixes what</text><text class="sm" x="508" y="466" text-anchor="start">is missing</text><rect class="note" x="452" y="602" width="250" height="52" rx="8"/><text class="sm" x="577" y="624" text-anchor="middle"><tspan x="577" dy="0">A second failure lets it end;</tspan><tspan x="577" dy="16">the Dispatcher then fails the task</tspan></text><text class="sm" x="238" y="652" text-anchor="start">yes</text><rect class="box w" x="45" y="666" width="370" height="54" rx="8"/><text x="230" y="689" text-anchor="middle"><tspan x="230" dy="0">The hook writes the token total into the note;</tspan><tspan x="230" dy="16">the Worker ends</tspan></text><path class="ar" d="M230 632V666" marker-end="url(#wa)"/><rect class="box m" x="93" y="754" width="274" height="54" rx="8"/><text x="230" y="777" text-anchor="middle"><tspan x="230" dy="0">The Dispatcher fetches the bundle</tspan><tspan x="230" dy="16">and reads the note</tspan></text><path class="ar" d="M230 720V754" marker-end="url(#wa)"/></svg>
