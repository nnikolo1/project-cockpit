<svg viewBox="0 0 780 490" role="img" aria-label="Task Queue: the Dispatcher, the Workers, and what connects them"><defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs><rect class="lane" x="20" y="150" width="360" height="250" rx="10"/><text class="lh" x="200" y="172" text-anchor="middle">Dispatcher (host)</text><rect class="lane" x="420" y="150" width="340" height="250" rx="10"/><text class="lh" x="590" y="172" text-anchor="middle">Workers (container, no network)</text><rect class="box " x="20" y="40" width="200" height="50" rx="8"/><text x="120" y="61" text-anchor="middle"><tspan x="120" dy="0">GitHub: task issues</tspan><tspan x="120" dy="16">and their labels</tspan></text><rect class="box " x="260" y="40" width="200" height="50" rx="8"/><text x="360" y="61" text-anchor="middle"><tspan x="360" dy="0">Cockpit: Settings</tspan><tspan x="360" dy="16">and Token Usage</tspan></text><rect class="box m" x="60" y="200" width="280" height="60" rx="8"/><text x="200" y="226" text-anchor="middle"><tspan x="200" dy="0">Firing (every 2 minutes)</tspan><tspan x="200" dy="16">assigns, watches, collects</tspan></text><rect class="box m" x="60" y="320" width="280" height="56" rx="8"/><text x="200" y="344" text-anchor="middle"><tspan x="200" dy="0">Proxy on a host socket</tspan><tspan x="200" dy="16">adds the credential, counts tokens</tspan></text><rect class="box w" x="450" y="200" width="280" height="60" rx="8"/><text x="590" y="226" text-anchor="middle"><tspan x="590" dy="0">Worker agent</tspan><tspan x="590" dy="16">one task, own clone, end check</tspan></text><rect class="box w" x="450" y="320" width="280" height="56" rx="8"/><text x="590" y="344" text-anchor="middle"><tspan x="590" dy="0">Relay on 127.0.0.1</tspan><tspan x="590" dy="16">to the proxy socket</tspan></text><rect class="box " x="60" y="430" width="280" height="40" rx="8"/><text x="200" y="454" text-anchor="middle"><tspan x="200" dy="0">Model API</tspan></text><path class="ar" d="M120 90V200" marker-end="url(#wa)" marker-start="url(#wa)"/><text class="sm" x="128" y="125" text-anchor="start">reads released tasks,</text><text class="sm" x="128" y="140" text-anchor="start">sets wip, unmerged, failed</text><path class="ar" d="M300 90V200" marker-end="url(#wa)" marker-start="url(#wa)"/><text class="sm" x="308" y="118" text-anchor="start">settings file (read),</text><text class="sm" x="308" y="133" text-anchor="start">processing log (written)</text><path class="ar" d="M340 230H450" marker-end="url(#wa)" marker-start="url(#wa)"/><text class="sm" x="395" y="222" text-anchor="middle">task folder:</text><text class="sm" x="395" y="252" text-anchor="middle">inbox, outbox</text><path class="ar" d="M590 260V320" marker-end="url(#wa)"/><path class="ar" d="M450 348H340" marker-end="url(#wa)"/><text class="sm" x="395" y="340" text-anchor="middle">proxy socket</text><path class="ar" d="M200 320V260" marker-end="url(#wa)"/><text class="sm" x="208" y="295" text-anchor="start">usage file (read)</text><path class="ar" d="M200 376V430" marker-end="url(#wa)"/></svg>
