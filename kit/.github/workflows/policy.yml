name: policy
on:
  issues: {types: [labeled, unlabeled]}
  schedule: [{cron: "*/10 * * * *"}]   # catches GITHUB_TOKEN-made changes, which trigger no workflows
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency: policy
jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MANAGER: ${{ vars.MANAGER }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 kit/policy.py
