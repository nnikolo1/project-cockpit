<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Project cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Layout: a calm working surface. One top bar, one content column, a slide-over for any single task.
   Colour: teal is the only accent and always means "act"; priority and blocker colours are semantic and never reused for decoration. */
:root{
  --bg:#f7f7f4;--surface:#ffffff;--line:#e2e0d8;--ink:#1d1d1a;--muted:#666560;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-tint:#e3f1ee;
  --p1:#b42318;--p1-ink:#ffffff;--p2:#f7d9bf;--p2-ink:#7d3503;--p3:#e6ecf5;--p3-ink:#2f4a73;
  --danger:#b42318;--danger-tint:#fdecea;--warn:#fbf0d9;--warn-ink:#724d00;--q-ok:#2e7d32;--q-warn:#d9a400;--q-bad:#b42318;--q-none:#9a9990;
  --s-embryo:#d9a400;--s-released:#c0392b;--s-wip:#0f766e;--s-unmerged:#2f5fc4;--s-failed:#8e3aa8;--s-merged:#2e7d32;
  --edge:#8b8a82;--add-bg:#e4f3e8;--add-ink:#14532d;--del-bg:#fdecea;--del-ink:#8f1d12;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151513;--surface:#1e1e1b;--line:#34342f;--ink:#ecebe6;--muted:#a09f97;
  --accent:#3fb5a8;--accent-ink:#0b1f1c;--accent-tint:#17332f;
  --p1:#e5645a;--p1-ink:#1a0503;--p2:#5a3a1c;--p2-ink:#f5d5b5;--p3:#26354d;--p3-ink:#cfdcf0;
  --danger:#f17b72;--danger-tint:#3a1a17;--warn:#3a2f12;--warn-ink:#f0cf84;--q-ok:#5fbf7a;--q-warn:#e0b94a;--q-bad:#e57368;--q-none:#77766e;
  --s-embryo:#e0b94a;--s-released:#e57368;--s-wip:#3fb5a8;--s-unmerged:#7ea2f0;--s-failed:#c98be0;--s-merged:#5fbf7a;--edge:#77766e;--add-bg:#143323;--add-ink:#9fe0b4;--del-bg:#3a1a17;--del-ink:#f4a8a0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151513;--surface:#1e1e1b;--line:#34342f;--ink:#ecebe6;--muted:#a09f97;
  --accent:#3fb5a8;--accent-ink:#0b1f1c;--accent-tint:#17332f;
  --p1:#e5645a;--p1-ink:#1a0503;--p2:#5a3a1c;--p2-ink:#f5d5b5;--p3:#26354d;--p3-ink:#cfdcf0;
  --danger:#f17b72;--danger-tint:#3a1a17;--warn:#3a2f12;--warn-ink:#f0cf84;--q-ok:#5fbf7a;--q-warn:#e0b94a;--q-bad:#e57368;--q-none:#77766e;
  --s-embryo:#e0b94a;--s-released:#e57368;--s-wip:#3fb5a8;--s-unmerged:#7ea2f0;--s-failed:#c98be0;--s-merged:#5fbf7a;--edge:#77766e;--add-bg:#143323;--add-ink:#9fe0b4;--del-bg:#3a1a17;--del-ink:#f4a8a0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:22px;margin:0;font-weight:600}h2{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12.5px}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:16px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);background:var(--accent-tint)}
.psel{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:34px;padding:0 8px;font-weight:600;max-width:100%}
.proto{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--warn);color:var(--warn-ink);font-size:12px;font-weight:600}
.pill.on{background:var(--accent-tint);color:var(--accent)}.pill.bad{background:var(--danger-tint);color:var(--danger)}
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.btn.small{min-height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.page{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.strip{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.strip b{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;background:var(--line);white-space:nowrap}

.p1{background:var(--p1);color:var(--p1-ink);font-weight:600}.p2{background:var(--p2);color:var(--p2-ink);font-weight:600}.p3{background:var(--p3);color:var(--p3-ink);font-weight:600}
.p0{background:none;border:1px dashed var(--s-embryo);color:var(--muted)}
.blk{background:var(--surface);border:1px solid var(--danger);color:var(--danger);font-weight:500}
.blocks{background:var(--warn);color:var(--warn-ink)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.f{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tblbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.blocked{background:var(--danger-tint)}tr.blocked td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.linkbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.linkbtn:hover{text-decoration:underline}
.inh{font-style:italic;color:var(--muted)}
.warnline{color:var(--danger);font-size:12px}
.heat{--h0:var(--line);--h1:color-mix(in srgb,var(--accent) 25%,var(--surface));--h2:color-mix(in srgb,var(--accent) 50%,var(--surface));--h3:color-mix(in srgb,var(--accent) 75%,var(--surface));--h4:var(--accent);overflow-x:auto}
.heat .g{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.heat .m{display:grid;grid-auto-flow:column;grid-auto-columns:11px;gap:3px;width:max-content;font-size:11px;height:16px;color:var(--muted)}
.heat .m span{overflow:visible;white-space:nowrap}
.heat .c{width:11px;height:11px;border-radius:2px;background:var(--h0)}
.heat .c.l1{background:var(--h1)}.heat .c.l2{background:var(--h2)}.heat .c.l3{background:var(--h3)}.heat .c.l4{background:var(--h4)}
.heat .lg{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.heat .lg .c{display:inline-block}
.feed{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.feed .e{display:grid;grid-template-columns:96px 84px 104px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.feed .e:last-child{border-bottom:0}
.seg{display:flex;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0;padding:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:9px 0;cursor:pointer;font-weight:600;background:var(--surface);border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{box-shadow:inset 0 0 0 2px currentColor}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.seg .l1{color:var(--p1);background:var(--danger-tint)}.seg .l2{color:var(--p2-ink);background:var(--p2)}.seg .l3{color:var(--p3-ink);background:var(--p3)}
.field{display:flex;flex-direction:column;gap:5px}
.field input[type=text],.field input[type=date],.field textarea,.field select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 11px;min-height:40px}
.field textarea{min-height:90px;resize:vertical}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:21;overflow-y:auto;border-left:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;display:flex;flex-direction:column;gap:14px}
.proposal{background:var(--warn);color:var(--warn-ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tile{display:flex;flex-direction:column;gap:3px}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.nw{border-style:dashed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:13px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:78vh}
.dg svg{display:block;margin:0 auto}.dg.fit svg{width:100%;height:auto;min-width:0}
.wf{display:block;width:100%;min-width:720px;height:auto}
.wf text{fill:var(--ink);font-family:var(--font);font-size:13px}
.wf .sm{font-size:12px;fill:var(--muted)}.wf .lh{font-size:13px;font-weight:600;fill:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wf .lane{fill:var(--bg);stroke:var(--line)}
.wf .box,.wf .dia{fill:var(--surface);stroke:var(--edge);stroke-width:1.3}
.wf .m{fill:var(--accent-tint);stroke:var(--accent)}.wf .w{fill:var(--p3);stroke:var(--p3-ink)}
.meta .note{margin:6px 0;padding:6px 10px;border-left:3px solid var(--edge);font-size:13px}.meta .note ul{margin:4px 0 0;padding-left:18px}
.wfhl .wfe,.wfhl path.ar{opacity:.28}.wfhl .wfe.hl{opacity:1}.wfhl .wfe.hl .box,.wfhl .wfe.hl .dia,.wfhl .wfe.hl .st{stroke:var(--accent);stroke-width:3.5}
.wf .st{fill:var(--line);stroke:none}.wf .note{fill:none;stroke:var(--edge);stroke-dasharray:4 3}
.wf path.ar{fill:none;stroke:var(--edge);stroke-width:1.5}.wf marker path{fill:var(--edge);stroke:none}
.page .page{padding-top:0}
.feed .e.rule{border-left:3px solid var(--warn-ink);background:var(--warn)}
.chip.rc{background:var(--warn-ink);color:var(--warn)}
.diff{font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:8px;overflow:auto;margin:0}
.diff span{display:block;padding:0 10px}.diff .a{background:var(--add-bg);color:var(--add-ink)}.diff .d{background:var(--del-bg);color:var(--del-ink)}.diff .h{color:var(--muted);padding-top:3px}
.rch{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.rch.un{border-color:var(--warn-ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subrow{display:grid;grid-template-columns:1fr 28px 70px;gap:6px 10px;align-items:center;padding:6px 8px;border-radius:8px}
.subrow:hover{background:var(--bg)}.subrow .bar{margin:0}.subrow .linkbtn{text-align:left}
.filters.sub{padding-left:18px;border-left:2px solid var(--line)}
.crumb{color:var(--muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
/* Churn bands reuse the priority palette (red, amber, blue are told apart without relying on hue) and always carry a symbol and a word. */
.band{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.band-hot{background:var(--p1);color:var(--p1-ink)}.band-mid{background:var(--p2);color:var(--p2-ink)}.band-cold{background:var(--p3);color:var(--p3-ink)}
.qbar{height:6px;border-radius:3px;background:var(--q-none)}.qbar.qb-ok{background:var(--q-ok)}.qbar.qb-warn{background:var(--q-warn)}.qbar.qb-bad{background:var(--q-bad)}
.qw{font-size:12px;font-weight:600}.qleg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}.qleg i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.qth{display:grid;grid-template-columns:minmax(120px,1fr) 80px 90px 90px;gap:8px;align-items:center}.qth input{min-height:36px;width:100%}
.band-dormant{background:none;border:1px dashed var(--s-embryo);color:var(--muted)}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.chg .pn{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.chg .pn.sub{margin-left:18px}
.chg .pn.b-hot{border-left-color:var(--p1)}.chg .pn.b-mid{border-left-color:var(--p2-ink)}.chg .pn.b-cold{border-left-color:var(--p3-ink)}.chg .pn.b-dormant{border-left-style:dashed;border-left-color:var(--s-embryo)}
.chg svg{width:100%;height:56px;display:block}
.chg .cs{fill:var(--accent)}.chg .ct{fill:var(--s-embryo)}.chg .cd{fill:var(--muted)}.chg .hit{fill:transparent}
.meta{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.meta details{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.meta summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .crow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.meta ul{margin:6px 0 0;padding-left:18px}.meta li{margin:2px 0;overflow-wrap:anywhere}
.gap{color:var(--danger);font-weight:600}
.act-col{white-space:nowrap;width:1%}
.btn.armed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.chip.stale{background:var(--warn);color:var(--warn-ink);font-weight:600}.chip.ok{background:var(--accent-tint);color:var(--accent)}.chip.dry{border:1px dashed var(--edge);background:none;color:var(--muted)}
.tblbox.narrow table{min-width:640px}
@media (max-width:640px){
  .feed .e{grid-template-columns:1fr;gap:4px}
  .proto{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .15s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app"></div>
<script>
//LOGIC-START
let TODAY='';
const STAGES=['embryo','released','wip','unmerged','failed','merged','cancelled'];  /* the six states, then the separate marker cancelled */
const STAGE_LABEL={embryo:'embryo',released:'released',wip:'WIP',unmerged:'unmerged',failed:'failed',merged:'merged',cancelled:'cancelled'};
const TYPES=['feature','bug','decision','research','doc','devops','test'];
function byKey(d,k){return d.tasks.find(t=>t.key===k);}
function eff(d,t){
  if(t.deadline)return {d:t.deadline,inh:false};
  const p=t.parent&&byKey(d,t.parent);
  if(p){const e=eff(d,p);if(e.d)return {d:e.d,inh:true,src:p.key};}
  const md=t.modDl;  // [date, id of the module it is set on]: the sub-module's own, else its module's
  if(md&&md[0])return {d:md[0],inh:true,src:(MODULES.find(m=>m.id===md[1])||{short:md[1]}).short};
  return {d:null,inh:false};
}
function days(a,b){const f=s=>{const x=s.split('-');return Date.UTC(+x[0],+x[1]-1,+x[2]);};return Math.round((f(b)-f(a))/864e5);}
function isOpen(t){return t.stage==='embryo'||t.stage==='released'||t.stage==='wip';}
function unfinished(d,t){return t.blockedBy.map(k=>byKey(d,k)).filter(b=>b&&b.stage!=='merged');}
function isBlocked(d,t){return (t.stage==='embryo'||t.stage==='released')&&unfinished(d,t).length>0;}
function blocksCount(d,t){return d.tasks.filter(x=>isOpen(x)&&x.blockedBy.includes(t.key)).length;}
function conflict(d,t){
  const me=eff(d,t).d;if(!me)return null;
  for(const b of unfinished(d,t)){const e=eff(d,b).d;if(e&&e>me)return b;}
  return null;
}
function cmp(d){return (a,b)=>
  ((a.prio||9)-(b.prio||9))||((eff(d,a).d||'9999').localeCompare(eff(d,b).d||'9999'))||(blocksCount(d,b)-blocksCount(d,a))||
  ((a.cls===b.cls)?0:(a.cls==='must'?-1:1))||a.key.localeCompare(b.key);}
function ranked(d){return d.tasks.filter(t=>t.stage==='released'&&unfinished(d,t).length===0).sort(cmp(d));}
function overdue(d,t){const e=eff(d,t).d;return isOpen(t)&&e&&e<TODAY;}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tok(n){return n==null?'':(n>=1000?Math.round(n/1000)+'k':String(n));}
function prioChip(t){return t.prio?'<span class="chip p'+t.prio+'">P'+t.prio+'</span>':'<span class="chip p0">none yet</span>';}
function dlHtml(t){const e=eff(D,t);if(!e.d)return '<span class="muted">—</span>';
  const n=days(TODAY,e.d);const rel=n<0?'overdue '+(-n)+' d':(n===0?'today':'in '+n+' d');
  const late=overdue(D,t);
  if(e.inh)return '<span class="inh">↳ '+e.d+'</span> <span class="muted" style="font-size:12px">'+esc(e.src)+'</span>'+(late?' <span class="warnline">'+rel+'</span>':'');
  return '<b>'+e.d+'</b> <span class="'+(late?'warnline':'muted')+'" style="font-size:12px">'+rel+'</span>';}
function blockHtml(t){
  const u=unfinished(D,t);const bc=blocksCount(D,t);let h='';
  if(isOpen(t)&&u.length){h+=u.map(b=>'<span class="chip blk">blocked by '+esc(b.key)+'</span>').join(' ');
    const c=conflict(D,t);if(c)h+='<div class="warnline">'+esc(c.key)+' is due '+eff(D,c).d+', after this</div>';}
  if(bc&&isOpen(t))h+=' <span class="chip blocks">blocks '+bc+'</span>';
  return h;}
function findingChip(t){return t.finding?'<span class="chip" title="Filed because a file contradicts a standing policy; released at once">finding</span>':'';}
function stageHtml(t){return t.stage==='wip'?'<b>WIP</b>':(t.stage==='embryo'||t.stage==='cancelled'?'<span class="muted">'+STAGE_LABEL[t.stage]+'</span>':STAGE_LABEL[t.stage]);}
function sortKey(t){return t.stage==='wip'?0:(t.stage==='released'?1:(t.stage==='embryo'?2:3));}


/* Data layer: everything comes from the backend (/api/state, /api/timeline, /api/code). Nothing is stored in the browser. */
let PROJ=null,PROJS=[],OFF=null;  /* OFF: set when this is an offline copy from a backup ({created, ghAttempts, gaps}) */  /* the selected project (name) and the configured ones; the choice is kept in localStorage `cockpit-project` */
const NOMETA=()=>({footprint:{status:'missing'},churn:{status:'missing'},ambiguity:{status:'missing'}});

     +tm.children.map(c=>MODULES.find(m=>m.id===c)).map(c=>b(c.id,esc(c.short),inMod(cur,c.id))).join('')

/* reload(pane): pane is the pane whose Refresh the owner clicked, else nothing is forced (timers, page loads, actions never bypass the hour).
   The pane decides which GitHub-sourced request is fetched now: the task state (Cockpit, Task Queue, Timeline, Code), the commit and rule inputs
   of the Timeline, the rules' pull requests (Settings, Policies), every project's state (Open questions). */
const PANE_STATE=['cockpit','backlog','timeline'];  /* the panes that show the GitHub task state; Code, Settings and Token Usage are local */
async function reload(pane){
  const mine=PROJ,fresh=PANE_STATE.includes(pane),ft=pane==='timeline',fr=pane==='settings',fq=pane==='questions';
  const errs=[],soft=(pr,d,w)=>pr.catch(e=>{errs.push(w+': '+e.message);return d;});  /* one failing part must not blank the others */
  /* 1. the local parts (no GitHub at all: Token Usage, Settings, Task Queue's Dispatcher part, code snapshot, card data): drawn as soon as they arrive,
        never waiting for the GitHub requests below */
  try{
    const [c,mt,se,cs,us,ql]=await Promise.all([soft(api('/api/code'),{wired:false,modules:{},diagrams:[]},'code'),api('/api/cardmeta').catch(e=>null),api('/api/settings').catch(e=>null),api('/api/cardsettings').catch(e=>null),api('/api/usage').catch(e=>null),api('/api/queue').catch(e=>null)]);
    if(mine!==PROJ)return;
    SET=se;CSET=cs;USE=us;QL=ql;CODE=c;META=mt||NOMETA();if(!D)MODULES=c.mods||[];  /* the Code tab's modules come from the local module map, not from GitHub */
    if(!CODE.modules[UI.codeMod]&&!MODULES.some(m=>m.id===UI.codeMod&&m.parent)){const k=MODULES.find(m=>!m.virtual);UI.codeMod=CODE.modules[k&&k.id]?k.id:'unassigned';}
    render();
  }catch(e){if(mine!==PROJ)return;errs.push(String(e.message||e));}
  /* 2. the GitHub-sourced parts: a failure leaves the copy the page already has, and the banner says so */
  const qp=loadQuestions(fq),pp=loadPrs(fr);
  try{
    const [s,f,r]=await Promise.all([soft(api('/api/state'+(fresh?'?fresh=1':'')),null,'state'),soft(api('/api/timeline'+(ft?'?fresh=1':'')),{entries:[],activity:[]},'timeline'),api('/api/rules').catch(e=>({configured:false,error:e.message}))]);
    if(mine!==PROJ)return;  /* the user switched project while this was loading: drop the answer */
    if(fresh)for(const k in MODDOC)delete MODDOC[k];
    if(s){D=s;TODAY=D.today;MODULES=D.modules;FEED=f.entries;ACT=f.activity||[];}  /* a failed state keeps the copy the page already has */
    RULES=r;UI.err=errs.join('; ');
    if(!CODE.modules[UI.codeMod]&&!MODULES.some(m=>m.id===UI.codeMod&&m.parent)){const k=MODULES.find(m=>!m.virtual);UI.codeMod=CODE.modules[k&&k.id]?k.id:'unassigned';}
  }catch(e){if(mine!==PROJ)return;UI.err=String(e.message||e);}
  render();  /* the questions of the other projects may take longer: they fill in when they arrive */
  clearTimeout(staleTimer);if(D&&D.stale&&mine===PROJ)staleTimer=setTimeout(()=>reload(false),4000);  /* a newer copy is being fetched: ask again shortly */
  await qp;await pp;
  if(mine===PROJ)render();
}
let staleTimer=0;
async function pickProject(name){
  if(name===PROJ)return;
  PROJ=name;try{localStorage.setItem('cockpit-project',name);}catch(e){}
  D=null;FEED=[];ACT=[];MODULES=[];CODE={wired:false,modules:{}};RULES={configured:false};META=NOMETA();REV=null;  /* page caches of the old project */
  for(const k in SVGC)delete SVGC[k];for(const k in MODDOC)delete MODDOC[k];
  Object.assign(UI,{filter:'all',mod:'all',ex:false,drawer:null,tlMod:'all',rulesGroup:'all',codeMod:'unassigned',err:''});
  render();await reload(false);
}

function revSet(sha,v){rev()[sha]=v;try{localStorage.setItem('cockpit-reviewed:'+D.source.repo,JSON.stringify(REV));}catch(e){}}

/* ---------- card metadata: churn, footprint, ambiguity (files written by the project side, see docs/contracts/card-metadata.md) ---------- */
const BAND={hot:['▲','hot'],mid:['●','mid'],cold:['▽','cold'],dormant:['–','dormant']};
const bandChip=b=>b?'<span class="band band-'+b+'">'+BAND[b][0]+' '+BAND[b][1]+'</span>':'<span class="muted">n/a</span>';
const sgn=n=>n>0?'+'+n:n<0?'−'+(-n):'0';
const ageTxt=a=>a<1?'under 1 h ago':a<48?Math.round(a)+' h ago':Math.round(a/24)+' d ago';
const hb=n=>n==null?'?':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
/* the code snapshot's age (CODE.age_h, CODE.stale against CODE.max_age_h, the 24 h of the standing policy) */
function snapAge(){

  return '<span class="muted">'+(CODE.age_h==null?'age unknown':ageTxt(CODE.age_h))+'</span>'+(CODE.stale?' <span class="chip blocks">⚠ stale: older than '+(CODE.max_age_h||24)+' h</span>':'');}

const churnRel=()=>!CSET||CSET.values.churn_colour==='size';  /* Settings > Module cards; size is the default */

  return '<div class="crow"><b>'+w+' d</b>'+bandChip(b)+'<span>'+e.commits+' commits · +'+e.added+' −'+e.removed+' · net '+sgn(e.net)+' · churn '+e.churn

   +'<b>Files and folders</b>'+li(m.files.map(x=>'<li><span class="mono">'+esc(x.path)+'</span> <span class="chip">'+x.location+' the repo</span>'+(x.personal_data?' <span class="chip blk">◆ personal data</span>':'')+' <span class="muted">'+esc(x.kind||'')+' '+(x.exists===false?'not present':x.count!=null?x.count+' files':x.size_bytes!=null?hb(x.size_bytes):'')+(x.written_by?' · written by '+esc(x.written_by):'')+'</span></li>'))

/* Calendar heatmap (GitHub style): 52 weeks ending TODAY, weeks as columns, Monday first. vals {YYYY-MM-DD: n}; tip(day,n) -> hover text.
   Shades 0..4 scale to the largest day shown (same rule as shade_level in logic.py). */
function shade(n,mx){return !n||n<=0||!mx?0:Math.min(4,Math.ceil(4*n/mx));}
function heatmap(vals,tip,legend){
  const U=s=>{const x=s.split('-');return Date.UTC(+x[0],+x[1]-1,+x[2]);},iso=t=>new Date(t).toISOString().slice(0,10),DAY=864e5;
  const t0=U(TODAY),mon=t0-((new Date(t0).getUTCDay()+6)%7)*DAY,start=mon-51*7*DAY;
  let mx=0;for(let t=start;t<=t0;t+=DAY)mx=Math.max(mx,vals[iso(t)]||0);
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let cells='',months='',prev=-1;
  for(let w=0;w<52;w++){
    const m=new Date(start+w*7*DAY).getUTCMonth();months+='<span>'+(m!==prev?MN[m]:'')+'</span>';prev=m;
    for(let r=0;r<7;r++){const t=start+(w*7+r)*DAY;
      if(t>t0){cells+='<i></i>';continue;}
      const d=iso(t),n=vals[d]||0;cells+='<i class="c l'+shade(n,mx)+'" title="'+esc(tip(d,n))+'"></i>';}
  }
  return '<div class="heat"><div class="m">'+months+'</div><div class="g">'+cells+'</div><div class="lg">Less '+[0,1,2,3,4].map(i=>'<i class="c l'+i+'"></i>').join('')+' More'+(legend?' &nbsp; '+legend:'')+'</div></div>';
}

  return '<div class="qbar qb-'+k+'" data-q="'+key+'" data-band="'+k+'" role="img" aria-label="'+esc(w)+'"></div><span class="qw" style="color:var(--ink)">'+QBAND[k][0]+' '+esc(w)+'</span>';}
function qTile(c,key,l,v,s){
  return '<div class="card tile"><span class="label">'+l+'</span><span class="v">'+(v==null?'<span class="muted">n/a</span>':v)+'</span>'+qBar(c,key)+'<span class="muted" style="font-size:13px">'+s+'</span></div>';}
function qLegend(){
  return '<div class="qleg" role="note"><span><i style="background:var(--q-ok)"></i>green: normal</span><span><i style="background:var(--q-warn)"></i>amber: borderline</span><span><i style="background:var(--q-bad)"></i>red: out of range</span><span><i style="background:var(--q-none)"></i>grey: no figure</span></div>';}

function vQuality(){
  const id=UI.codeMod;const c=CODE.modules[id];const mm=MODULES.find(m=>m.id===id);const nm=id==='unassigned'?'Not mapped to a module':(mm?(mm.parent?modShort(id):mm.name):id);
  const snap=CODE.wired?'Snapshot '+esc(CODE.commit)+', '+esc((CODE.generated_at||'').slice(0,10))+', '+snapAge()+'. Dimensions stay separate: no overall score, colours follow the thresholds in Settings.':'';
  let h='<div class="page"><div><h1>Code: '+esc(nm)+'</h1><span class="muted">'+snap+'</span></div>';
  h+=modFilter(id,'codem',null,'whole module (roll-up)',false,[{id:'unassigned',short:'Unassigned'}]);
  if(!c)return h+'<div class="card tile nw"><span class="label">Code snapshot</span><span class="v muted" style="font-size:18px">not wired</span><span class="muted" style="font-size:13px">'+(CODE.wired?'no metrics for this module in the snapshot':CODE.configured?'the snapshot folder has no readable metrics.json; the daily refresh runs the collector (code_collect)':'no code snapshot configured: set the project\'s code folder and code_collect command')+'</span></div></div>';
  const T=(l,v,s)=>'<div class="card tile"><span class="label">'+l+'</span><span class="v">'+(v==null?'<span class="muted">n/a</span>':v)+'</span><span class="muted" style="font-size:13px">'+s+'</span></div>';
  const f1=(v,n)=>v==null?null:v.toFixed(n);
  const big=(c.biggest||[]).length?'<br>Biggest files:'+c.biggest.map(f=>'<br><a class="mono" target="_blank" rel="noopener" href="'+esc(f.url||'#')+'">'+esc(f.path)+'</a> '+f.lines.toLocaleString('en-US')+' lines'+(f.kind==='code'?'':' ('+f.kind+')')).join(''):'';
  if(!c.filesN)return h+'<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">'+T('Size',null,'files of this module'+big)+'<div class="card tile nw"><span class="label">Quality metrics</span><span class="v muted" style="font-size:18px">not measured</span><span class="muted" style="font-size:13px">the snapshot analyses Python and JavaScript files only; this module has none</span></div></div></div>';
  h+=qLegend()+'<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">'
   +T('Size',c.code==null?null:c.code.toLocaleString('en-US'),'code lines'+(c.files?' · '+esc(c.files):'')+big)
   +qTile(c,'complexity','Complexity',c.cc,'worst block'+(c.ccAt?' ('+esc(c.ccAt)+')':'')+' · mean '+(c.mean==null?'n/a':c.mean.toFixed(1))+' · '+(c.dfe==null?'n/a':c.dfe)+' blocks rated D to F')
   +qTile(c,'maintainability','Maintainability',f1(c.mi,1),'mean index')
   +qTile(c,'lint','Lint',c.lint,esc(c.lintNote||'default ruleset'))
   +qTile(c,'dead','Dead-code candidates',c.dead,'candidates only; many are false positives')
   +qTile(c,'cycles','Import cycles',c.cyc==null?null:c.cyc+' files','in cycles')
   +qTile(c,'duplication','Duplication',c.dup==null?null:c.dup.toFixed(2)+'%','of code lines')
   +qTile(c,'docstrings','Docstrings',c.doc==null?null:c.doc.toFixed(1)+'%','documented')
   +qTile(c,'coverage','Test coverage',c.cov==null?null:c.cov.toFixed(1)+'%',c.cov==null?(c.pyN===0?'no Python source files to measure':'no coverage data: needs a coverage run (pytest --cov)'):'of '+(c.covN||0).toLocaleString('en-US')+' statements covered')
   +(c.churn!=null?T('Churn',c.churn,esc(c.churnNote)):'')+(c.testRatio!=null?qTile(c,'tests','Tests',c.testRatio,'test-to-code ratio; '+esc(c.testsNote)):'')+'</div>';
  h+='<div class="tblbox"><table style="min-width:560px"><thead><tr><th>Hotspot</th><th>Commits in window</th><th>Worst complexity</th><th></th></tr></thead><tbody>'
   +(c.hot||[]).map((x,i)=>'<tr><td class="mono">'+esc(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+(ST()?'<button class="btn small" data-act="hotspot" data-m="'+id+'" data-i="'+i+'">File a task</button>':'')+'</td></tr>').join('')
   +'</tbody></table></div><p class="muted" style="font-size:13px;margin:0">Hotspot = commits in the window × worst block complexity: a sorting aid, not a verdict..</p></div>';
  return h;
}

/* ---------- code intelligence tabs, diagrams, workflow ---------- */
const DIAG={
 deps:{t:'Module dependency graph',d:'Who imports whom among the packages. An arrow from A to B means A imports B. Red edges are packages that import each other (cycles). Whole repository, not one module.'},
 flow:{t:'Data flow: code to database tables',d:'Which packages read from or write to which database tables, found by scanning the SQL in the code. Blue solid arrows write, grey dotted arrows read. A heuristic scan: it misses table names built at run time.'},
 erd:{t:'Entity-relationship diagram of the database',d:'The tables of the database grouped by name prefix, with the declared foreign keys between them. Amber dashed edges would mark relations only inferred from column names.'},
 js:{t:'JavaScript dependency graph',d:'The scripts of the project and which script loads which.'}
};
const SVGFILE={deps:'deps',flow:'dataflow',erd:'erd',js:'js'};
function vDiagram(k){
  const x=DIAG[k];const fit=UI.fit[k];
  if(!CODE.wired||!CODE.diagrams.includes(SVGFILE[k]))return '<div class="card tile nw"><span class="label">'+x.t+'</span><span class="v muted" style="font-size:18px">not wired</span><span class="muted" style="font-size:13px">point --code at a code snapshot directory</span></div>';
  return '<div class="row spread"><div style="max-width:70ch"><h2>'+x.t+'</h2><p class="muted" style="margin:4px 0 0">'+x.d+'</p></div><button class="btn small" data-act="fit" data-v="'+k+'">'+(fit?'Actual size':'Fit to width')+'</button></div>'
   +'<div class="dg'+(fit?' fit':'')+'" id="dgbox" data-k="'+k+'">'+(SVGC[k]||'<span class="muted">Loading…</span>')+'</div><p class="muted" style="font-size:13px;margin:0">Snapshot '+esc(CODE.commit)+', '+esc((CODE.generated_at||'').slice(0,10))+'. Regenerate the snapshot to refresh.</p>';
}
async function hydrate(){
  if(UI.route==='backlog'&&modPage())loadModDoc(UI.mod);
  const b=document.getElementById('dgbox');if(!b||SVGC[b.dataset.k])return;
  const k=b.dataset.k;
  const mine=PROJ;
  try{const r=await fetch(pq('/code/'+SVGFILE[k]+'.svg'));  /* links to report pages carry the project too */
    SVGC[k]=(await r.text()).replace(/(href="[^"]*\/report\/[^"#?]+)"/g,PROJ?'$1?project='+encodeURIComponent(PROJ)+'"':'$&');}catch(e){SVGC[k]='<span class="warnline">could not load the diagram</span>';}
  if(mine!==PROJ){delete SVGC[k];return;}
  const again=document.getElementById('dgbox');if(again&&again.dataset.k===k)again.innerHTML=SVGC[k];
}
function chgBars(p){
  const ws=p.weeks,mx=Math.max(1,...ws.map(x=>x.src+x.tests+x.docs));let g='';
  ws.forEach((x,i)=>{let y=56;const t=x.w+': '+x.commits+' commits, +'+x.added+' −'+x.removed+' lines (source '+x.src+', tests '+x.tests+', documents '+x.docs+')';
    [['cs',x.src],['ct',x.tests],['cd',x.docs]].forEach(([c,v])=>{const h=v/mx*54;if(h>0){y-=h;g+='<rect class="'+c+'" x="'+(i*4+.5)+'" y="'+y.toFixed(1)+'" width="3" height="'+h.toFixed(1)+'"/>';}});
    g+='<rect class="hit" x="'+i*4+'" y="0" width="4" height="56"><title>'+esc(t)+'</title></rect>';});
  return '<svg viewBox="0 0 '+ws.length*4+' 56" preserveAspectRatio="none" role="img" aria-label="Weekly churn of the last '+ws.length+' weeks">'+g+'</svg>';}
function vChanges(){
  const c=META.churn,h='<div class="row spread"><div><h2>Changes</h2><span class="muted">Weekly churn (lines added plus removed) of the last 52 weeks, ranked by the last 30 days.</span></div>'+asOf(c)+'</div>';
  if(c.status!=='ok')return h;
  const ps=c.view.changes||[];

   +'<div class="chg">'+ps.map(p=>{const e=((c.view.modules[p.id]||{}).windows||{})['30'],b=e&&e[churnRel()?'band_rel':'band_abs'];
    return '<div class="pn'+(p.level?' sub':'')+(b?' b-'+b:'')+'"><div class="row spread"><b>'+esc(modShort(p.id))+'</b>'+bandChip(b||null)+'</div>'
     +(p.weeks?chgBars(p)+'<span class="muted" style="font-size:12px">'+p.churn52+' lines in 52 weeks · '+p.commits90+' commits in 90 days</span>':'<span class="muted">no weekly data yet (run the card-metadata collector)</span>')+'</div>';}).join('')+'</div>';}

}

  t.flags.forEach(f=>{h+='<div class="proposal" style="background:var(--danger-tint);color:var(--danger)"><b>Unauthorised change.</b> '+esc(f)+'. Ignored until the Manager sets it again.</div>';});
  const c=conflict(D,t);if(c)h+='<div class="proposal" style="background:var(--danger-tint);color:var(--danger)"><b>Deadline conflict.</b> '+esc(c.key)+' blocks this task and is due '+eff(D,c).d+', after '+e.d+'.</div>';

  }else h+='<p class="muted">Finished work is not reopened. File a new task instead.</p><button class="btn" data-act="followup" data-k="'+t.key+'">File a follow-up task</button>';
  if(isOpen(t)){
    h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Blockers</h2><div class="chips">'+(t.blockedBy.length?t.blockedBy.map(k=>'<button class="chip blk" style="cursor:pointer" data-act="unblock" data-k="'+t.key+'" data-b="'+k+'" aria-label="Remove blocker '+k+'">'+esc(k)+' ×</button>').join(''):'<span class="muted">No blockers.</span>')+'</div>'
     +'<form class="row" data-form="block" data-k="'+t.key+'"><label class="muted" for="bk" style="font-size:13px">Blocked by</label><select id="bk" name="b" style="border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;min-height:36px;max-width:220px">'+others.filter(isOpen).map(x=>'<option value="'+x.key+'">'+esc(x.key)+' '+esc(x.title.slice(0,28))+'</option>').join('')+'</select><button class="btn small">Add</button></form></div>';
    h+='<div class="row"><button class="btn small" data-act="subtask" data-k="'+t.key+'">File a sub-task</button>'
     +(SIM()&&t.stage==='released'&&!isBlocked(D,t)?'<button class="btn small" data-act="take" data-k="'+t.key+'">Simulate: Orchestrator takes it</button>':'')
     +(SIM()&&t.stage==='wip'?'<button class="btn small" data-act="complete" data-k="'+t.key+'">Simulate: Orchestrator completes it</button>':'')
     +''+armBtn('cancel',t)+'</div>';
  }
  }
  if(kids.length)h+='<div class="card"><h2>Sub-tasks</h2>'+kids.map(k=>'<div><button class="linkbtn" data-act="open" data-k="'+k.key+'"><b class="mono">'+esc(k.key)+'</b> '+esc(k.title)+'</button> '+prioChip(k)+'</div>').join('')+'</div>';
  const ev=D.events.filter(x=>x.key===t.key);
  h+='<div class="card"><h2>History</h2><div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px">'+(ev.length?ev.map(x=>'<span><span class="mono muted">'+x.t.slice(5)+'</span> <b>'+esc(x.actor)+'</b> '+esc(x.text)+'</span>').join(''):'<span class="muted">No events yet.</span>')+'</div></div>';
  return h;
}
function drawerNew(p){
  p=p||{};
  const mods=MODULES.filter(m=>!m.virtual);
  return '<div class="row spread"><h1 style="font-size:19px">New task</h1><button class="btn small" data-act="close">Cancel</button></div>'
   +'<form data-form="new" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="nt">Title</label><input id="nt" type="text" name="title" required value="'+esc(p.title||'')+'"></div>'
   +'<div class="field"><label for="nd">Description</label><textarea id="nd" name="desc">'+esc(p.desc||'')+'</textarea></div>'
   +'<div class="field"><label for="nm">Module</label><select id="nm" name="module">'+mods.map(m=>'<option value="'+m.id+'"'+((p.module||'')===m.id?' selected':'')+'>'+esc(m.parent?modShort(m.id):m.name)+'</option>').join('')+'<option value=""'+(mods.some(m=>m.id===p.module)?'':' selected')+'>No module</option></select></div>'
   +'<div class="row"><div class="field" style="flex:1"><label for="ny">Type</label><select id="ny" name="type">'+TYPES.map(x=>'<option'+(x===(p.type||'decision')?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
   +'<div class="field" style="flex:1"><label for="nc">Class</label><select id="nc" name="cls"><option>nice</option><option>must</option></select></div></div>'
   +'<div class="field"><label for="np">Parent task (optional)</label><select id="np" name="parent"><option value="">None, directly under the module</option>'+D.tasks.filter(isOpen).map(x=>'<option value="'+x.number+'"'+(p.parent===x.number?' selected':'')+'>'+esc(x.key)+' '+esc(x.title.slice(0,40))+'</option>').join('')+'</select></div>'
   +'<div class="proposal" style="background:var(--accent-tint);color:var(--ink)">Saved as an embryo. Only you can release it, set its priority or a deadline. The Orchestrator makes the token estimate.</div><button class="btn primary">Save</button></form>';
}

/* ---------- render and actions ---------- */
function render(){
  if(UI.route==='how'){UI.route='code';UI.codeTab='flowchart';}
  if(UI.route==='rules'){UI.route='settings';UI.setSec='policies';}  /* old route */
  const R=UI.route;
  const nav=[['cockpit','Cockpit'],['backlog','Task Queue'],['questions','Open questions'],['timeline','Timeline'],['settings','Settings'],['usage','Token Usage'],['code','Code']];
  let h='<div class="top"><span class="brand">Project cockpit</span><nav class="nav" aria-label="Main">'+nav.map(n=>'<button data-act="go" data-r="'+n[0]+'"'+(R===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[0]==='questions'?' <span class="chip" aria-label="'+Q.questions.length+' open">'+Q.questions.length+'</span>':n[0]==='backlog'&&runCount()?' <span class="chip" aria-label="'+runCount()+' running">'+runCount()+'</span>':'')+'</button>').join('')+'</nav>';
  if(PROJS.length>1)h=h.replace('</span><nav','</span><select class="psel" id="psel" aria-label="Project">'+PROJS.map(p=>'<option value="'+esc(p.name)+'"'+(p.name===PROJ?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><nav');
  if(D){const s=D.source;
    h+='<div class="proto"><span class="pill'+(s.steering?' on':'')+'">'+esc(s.repo)+', '+(s.steering?'steering on':'read-only')+'</span>'
     +(s.steering&&s.user&&s.user!==s.manager?'<span class="pill bad">acting as '+esc(s.user)+', not the Manager ('+esc(s.manager)+')</span>':'')
     +'</div>';}
  h+='</div>';
  if(OFF)h+='<div class="page" style="padding-bottom:0"><div class="card" role="status" style="border-color:var(--warn,var(--danger))"><b class="warnline">offline copy, data from '+esc(new Date(OFF.created*1000).toLocaleString())+'</b> <span class="muted">No GitHub call is made; actions are off.'+(OFF.gaps&&OFF.gaps.length?' Not in the backup: '+esc(OFF.gaps.map(g=>g.pane).join(', '))+'.':'')+'</span></div></div>';
  h+=paneBar(R);
  const LOCAL=R==='settings'||R==='usage'||R==='questions'||R==='backlog'||R==='code';  /* tabs with a local part: shown without the GitHub state */
  const GHR=PANE_STATE.includes(R);  /* only these tabs show GitHub-state banners */
  if(GHR&&D&&D.staleNote){const n=D.staleNote;h+='<div class="page" style="padding-bottom:0"><div class="card" style="border-color:var(--warn,var(--danger))"><b class="warnline">GitHub data is old.</b> <span class="muted">Showing the copy from '+esc(D.source.fetched)+' ('+ageMin(n.age_s)+' old). '+(n.rate_limited?'GitHub rate limit reached; ':'GitHub could not be read ('+esc(n.error)+'); ')+(n.until?'next try at '+esc(new Date(n.until*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))+'. ':'next try within a minute. ')+'</span> <button class="btn small" data-act="refresh">Retry</button></div></div>';}
  if(GHR&&UI.err&&!D)h+='<div class="page" style="padding-bottom:0"><div class="card" style="border-color:var(--danger)"><b class="warnline">Could not load from GitHub, and no earlier copy exists.</b> <span class="muted">'+esc(UI.err)+'</span> <button class="btn small" data-act="refresh">Retry</button></div></div>';
  else if(GHR&&UI.err)h+='<div class="page" style="padding-bottom:0"><div class="card" style="border-color:var(--danger)"><span class="warnline">Some parts could not be loaded:</span> <span class="muted">'+esc(UI.err)+'</span></div></div>';
  if(!D&&!LOCAL){if(!UI.err)h+='<div class="page"><span class="muted">Loading…</span></div>';}
  else{
  h+=R==='cockpit'?vCockpit():R==='backlog'?vBacklog():R==='questions'?vQuestions():R==='timeline'?vTimeline():R==='settings'?vSettings():R==='usage'?vUsage():vCode();
  if(UI.drawer){const t=UI.drawer.key&&byKey(D,UI.drawer.key);h+='<div class="drawer-bg" data-act="close"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Task">'+(UI.drawer.mode==='new'&&ST()?drawerNew(UI.drawer.prefill):(t?drawerTask(t):''))+'</div>';}
  }
  if(UI.toast)h+='<div class="toast" role="status">'+esc(UI.toast)+'</div>';
  document.getElementById('app').innerHTML=h;
  hydrate();
}
let toastTimer=null,armTimer=null;
function say(m,ms){UI.toast=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{UI.toast='';render();},ms||2200);render();}
const num=k=>{const t=byKey(D,k);return t&&t.number;};
function act(a,ds){
  const t=ds.k&&byKey(D,ds.k);
  if(a!=='arm'&&UI.armed){UI.armed=null;clearTimeout(armTimer);}  /* any other click disarms */
  switch(a){
   case 'qtdefaults':{const d=(CSET.defaults||{}).quality_thresholds||{},f=document.querySelector('[data-form=cardsettings]');
     Object.keys(d).forEach(k=>['ok','warn'].forEach(x=>{const i=f.elements['qt_'+k+'_'+x];if(i)i.value=d[k][x];}));say('Defaults filled in; press Save to keep them.');break;}
   case 'setsec':UI.setSec=ds.v;render();break;
   case 'go':UI.route=ds.r;if(ds.r==='how'){UI.route='code';UI.codeTab='flowchart';}if(ds.r==='rules'){UI.route='settings';UI.setSec='policies';}UI.drawer=null;render();window.scrollTo(0,0);break;
   case 'code':UI.route='code';UI.codeTab='quality';UI.codeMod=ds.m;render();window.scrollTo(0,0);break;
      case 'codetab':UI.codeTab=ds.v;render();break;
   case 'fit':UI.fit[ds.v]=!UI.fit[ds.v];render();break;
   case 'codem':UI.codeMod=ds.v;render();break;
   case 'mod':UI.route='backlog';UI.mod=ds.m;UI.ex=!!ds.x;UI.filter='all';render();window.scrollTo(0,0);break;
   case 'filter':UI.filter=ds.v;render();break;
   case 'modf':UI.mod=ds.v;UI.ex=!!ds.x;render();break;
   case 'qproj':UI.qProj=ds.v;render();break;
   case 'tlm':UI.tlMod=ds.v;render();break;
   case 'tlt':UI.tlType=ds.v;render();break;
   case 'rg':UI.rulesGroup=ds.v;render();break;
   case 'rev':revSet(ds.id,true);render();break;
   case 'unrev':revSet(ds.id,false);render();break;
   case 'revall':ruleChanges().forEach(r=>revSet(r.sha,true));render();break;
   case 'open':UI.drawer={mode:'task',key:ds.k};render();break;
   case 'close':UI.drawer=null;render();break;
   case 'refresh':reload(ds.pane||UI.route);break;
   case 'new':UI.drawer={mode:'new'};render();break;
   case 'subtask':UI.drawer={mode:'new',prefill:{parent:t.number,module:t.module,title:'',type:'feature'}};render();break;
   case 'followup':UI.drawer={mode:'new',prefill:{module:t.module,title:'Follow up on '+t.key,desc:'Follow-up to '+t.key+' ('+t.title+').',type:t.type}};render();break;
   case 'hotspot':{const c=CODE.modules[ds.m];const x=c.hot[+ds.i];const real=MODULES.some(m=>m.id===ds.m&&!m.virtual);UI.drawer={mode:'new',prefill:{module:real?ds.m:'',title:'Reduce the complexity of '+x[0]+' (worst block '+x[2]+')',desc:'From the code snapshot '+CODE.commit+': '+x[1]+' commits in the window, worst block complexity '+x[2]+'.',type:'devops'}};UI.route='backlog';render();break;}
   case 'take':case 'complete':post({action:a,n:t.number});break;
   case 'arm':{const id=ds.a+':'+ds.k;
     if(UI.armed!==id){UI.armed=id;clearTimeout(armTimer);armTimer=setTimeout(()=>{UI.armed=null;render();},6000);render();break;}
     UI.armed=null;clearTimeout(armTimer);
     post(ds.a==='submit'?{action:'release',n:t.number,p:'P2',d:''}:{action:'cancel',n:t.number});break;}
   case 'unblock':post({action:'unblock',n:t.number,b:num(ds.b)});break;
   case 'accept':case 'dismiss':post({action:a,n:+ds.n,id:ds.id});break;
  }
}
document.addEventListener('click',function(e){const b=e.target.closest('[data-act]');if(!b)return;if(b.classList.contains('drawer-bg')&&e.target!==b)return;act(b.dataset.act,b.dataset);});
document.addEventListener('change',function(e){if(e.target.id==='psel')pickProject(e.target.value);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&UI.drawer){UI.drawer=null;render();}});
document.addEventListener('submit',async function(e){
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fd=new FormData(f);const k=f.dataset.k;const t=k&&byKey(D,k);const kind=f.dataset.form;
  if(kind==='release')post({action:'release',n:t.number,p:fd.get('p'),d:fd.get('d')||''});
  else if(kind==='change')post({action:'change',n:t.number,p:fd.get('p')||'',d:fd.get('d')||''});
  else if(kind==='block')fd.get('b')&&post({action:'block',n:t.number,b:num(fd.get('b'))});
  else if(kind==='settings'){const b={action:'settings',enabled:f.elements.enabled.checked};
    SETROWS.slice(1).forEach(r=>{b[r[0]]=fd.get(r[0]);});post(b);}
  else if(kind==='cardsettings')post({action:'cardsettings',churn_colour:fd.get('churn_colour'),quality_thresholds:qThRead(fd)});
  else if(kind==='moddl')post({action:'moddl',module:f.dataset.m,d:fd.get('d')||''});
  else if(kind==='new'){const title=fd.get('title');
    if(await post({action:'new',title:title,desc:fd.get('desc'),module:fd.get('module'),type:fd.get('type'),cls:fd.get('cls'),parent:fd.get('parent')||''})){
      const nt=D.tasks.filter(x=>x.title===title).sort((a,b)=>b.number-a.number)[0];UI.drawer=nt?{mode:'task',key:nt.key}:null;UI.route='backlog';UI.filter='all';render();}}
});
setInterval(()=>{if(document.visibilityState==='visible'&&!UI.drawer&&D)reload(false);},180000);
boot();
</script>
